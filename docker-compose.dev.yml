# Base de datos de desarrollo y pruebas con PostGIS.
#
#   POSTGRES_PASSWORD=<una-clave> docker compose -f docker-compose.dev.yml up -d
#
# Cadena de conexion para la API (User Secrets):
#   dotnet user-secrets set "ConnectionStrings:Postgres" "Host=localhost;Port=5433;Database=SIGENRD;Username=postgres;Password=<una-clave>" --project SIGENRDWebApi
#
# Para las pruebas de integracion:
#   ENERGYMAP_TEST_DB="Host=localhost;Port=5433;Username=postgres;Password=<una-clave>" dotnet test
services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: energymap-postgis
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: SIGENRD
    ports:
      - "5433:5432"
    volumes:
      - energymap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  energymap-pgdata:
