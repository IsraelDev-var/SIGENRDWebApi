name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]
  # Lo reutiliza cd.yml: nada se publica sin pasar por aqui.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Servicios reales: las pruebas de integracion corren contra PostGIS y un servidor SMTP de desarrollo.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mail:
        image: rnwood/smtp4dev:latest
        ports:
          - 5025:25
          - 5080:80

    env:
      ENERGYMAP_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password
      ENERGYMAP_TEST_SMTP: localhost;5025;http://localhost:5080
      ENERGYMAP_TEST_BLOB: UseDevelopmentStorage=true

    steps:
      - uses: actions/checkout@v4

      # Emulador de Azure Blob Storage para probar el almacén de documentos de producción.
      # Va como paso y no como servicio porque necesita argumentos (el SDK usa una versión de API más nueva).
      - name: Azurite
        run: >-
          docker run -d --name azurite -p 10000:10000
          mcr.microsoft.com/azure-storage/azurite:3.33.0
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore SIGENRD.sln

      - name: Compilar
        run: dotnet build SIGENRD.sln --no-restore -c Release

      - name: Paquetes vulnerables
        # Las filas de resultado empiezan con ">": no depende del idioma de la salida.
        run: |
          dotnet list SIGENRD.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -Eq '^\s*>' vulnerable.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas."
            exit 1
          fi

      - name: Esperar al servidor SMTP de desarrollo
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5080/api/messages > /dev/null && exit 0
            sleep 2
          done
          echo "::error::smtp4dev no respondio."
          exit 1

      - name: Probar
        run: >
          dotnet test SIGENRD.sln --no-build -c Release
          --logger "trx;LogFileName=resultados.trx"
          --results-directory TestResults

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-pruebas
          path: TestResults/*.trx
          if-no-files-found: ignore

      # Contrato de la API (B-8). Las pruebas ya comprobaron que coincide con lo que genera esta compilación.
      - name: Publicar el contrato OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-v1
          path: docs/api/openapi-v1.json
          if-no-files-found: error

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo comprueba que la imagen compila: la publicacion es de cd.yml.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
