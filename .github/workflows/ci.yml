name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore SIGENRD.sln
      - name: Build
        run: dotnet build SIGENRD.sln --no-restore -c Release
      - name: Test
        run: dotnet test SIGENRD.sln --no-build -c Release --verbosity normal
