name: Frontend

on:
  push:
    branches: ['**']
    paths: ['frontend/**', 'docs/api/**', 'SIGENRD*/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [master, main]
    paths: ['frontend/**', 'docs/api/**', 'SIGENRD*/**', '.github/workflows/frontend.yml']
  # El CD lo llama antes de publicar la imagen del frontend.
  workflow_call:

concurrency:
  # github.workflow es el del flujo que llama: el CD no cancela ni es cancelado por la corrida del push.
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Verificar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Las pruebas E2E de sesión y permisos corren contra la API real (ver playwright.config.ts).
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENERGYMAP_E2E_DB: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      # Versión de pnpm tomada de "packageManager" en frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El contrato lo valida OpenApiContractTests en el CI del backend; aquí se comprueba que los tipos coinciden con él.
      - name: Tipos de la API al día con docs/api/openapi-v1.json
        run: |
          pnpm api:types
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::src/lib/api/schema.d.ts no coincide con el contrato. Ejecuta 'pnpm api:types' y súbelo."
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Herramientas de la API para las pruebas E2E
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.10
          dotnet build ../SIGENRDWebApi/SIGENRDWebApi.csproj -c Debug

      - name: Navegador para las pruebas E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas E2E, accesibilidad y sesión contra la API
        run: pnpm e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  docker:
    name: Imagen Docker del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo comprueba que compila; la publica el CD.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: energymap-web:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # La imagen arranca como usuario sin privilegios y responde /api/salud con su configuración mínima.
      - name: Prueba de humo de la imagen
        working-directory: .
        run: |
          # Una llave pública cualquiera (PEM con saltos de línea; en App Service va en una línea con \n).
          key=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null | openssl pkey -pubout)
          docker run -d --name web -p 8080:8080 \
            -e ENERGYMAP_API_URL=http://api.invalid:8080 \
            -e ENERGYMAP_JWT_PUBLIC_KEY="$key" \
            energymap-web:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/salud | grep -q Healthy; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/salud | grep -q Healthy || { docker logs web; exit 1; }
          test "$(docker exec web id -u)" != "0" || { echo "::error::La imagen corre como root."; exit 1; }
          curl -sfI http://localhost:8080/ | grep -qi '^content-security-policy:' || { echo "::error::Falta la CSP."; exit 1; }
          echo "La imagen responde Healthy, con CSP y sin root."
